goal_file: tasks/flappy_qlearning/goal.md

planner:
  provider: local_command
  model: state-dependent-smoke-planner
  command: ["{python}", tools/mock_llm_planner.py]
  timeout_seconds: 10

budget:
  max_iterations: 3
  max_agent_steps: 6
  max_consecutive_failures: 3
  max_wall_time_minutes: 5
  experiment_timeout_seconds: 60

experiment:
  command:
    - "{python}"
    - tasks/flappy_qlearning/run.py
    - --config
    - "{config_path}"
    - --run-id
    - "{experiment_id}"
    - --timeout-seconds
    - "{timeout_seconds}"
  metrics_path: runs/{experiment_id}/summary.json

objective:
  metric: mean_score
  direction: maximize
  target: 999.0
  min_improvement: 0.0
  tie_breaker_metric: mean_reward
  tie_breaker_min_improvement: 0.0

baseline:
  seed: 0
  render: false
  training_episodes: 1
  evaluation_episodes: 1
  save_every: 1
  input_q_table: tasks/flappy_qlearning/data/q_tables/Qvals.npy
  q_init: heuristic
  fps_train: 1500
  fps_eval: 1500
  learning_rate: 0.6
  learning_rate_min: 0.1
  learning_rate_decay: 0.9995
  discount_factor: 0.95
  epsilon_start: 0.001
  epsilon_end: 0.001
  epsilon_decay: 1.0
  sample_t: 3
  state_discretization:
    dx_dy_bin_size: 25
    velocity_bin_size: 2
  rewards:
    pipe_passed: 10
    alive: 0.05
    death: -50
  environment:
    player_flap_acc: -10

search_space:
  learning_rate: [0.4, 0.6]
  epsilon_start: [0.001, 0.01, 0.05]
  discount_factor: [0.9, 0.95, 0.99]
  sample_t: [2, 3]
  rewards.alive: [0.02, 0.05, 0.1]
