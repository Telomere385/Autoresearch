program_file: docs/PROGRAM.md
task_file: tasks/flappy_qlearning/task.yaml
goal_file: tasks/flappy_qlearning/goal.md

planner:
  type: llm
  provider: local_command
  model: mock-local-planner
  api_key_env: null
  timeout_seconds: 60
  temperature: 0.0
  local_endpoint: null
  local_command: python tools/mock_llm_planner.py

budget:
  max_iterations: 1
  max_wall_time_minutes: 5
  seed: 0
  training_episodes: 1
  evaluation_episodes: 1
  save_every: 1

objective:
  primary_metric: mean_score
  target_mean_score: 1.0
  tie_breaker_metric: mean_reward
  tie_breaker_min_improvement: 0.0
  diagnostic_metrics: [mean_reward, total_training_time]
  direction: maximize
  min_improvement: 0.0

base_experiment:
  render: false
  input_q_table: tasks/flappy_qlearning/data/q_tables/Qvals.npy
  q_init: heuristic
  fps_train: 1500
  fps_eval: 1500
  learning_rate: 0.6
  learning_rate_min: 0.1
  learning_rate_decay: 0.9995
  discount_factor: 0.95
  epsilon_start: 0.001
  epsilon_end: 0.001
  epsilon_decay: 1.0
  sample_t: 3
  state_discretization:
    dx_dy_bin_size: 25
    velocity_bin_size: 2
  rewards:
    pipe_passed: 10
    alive: 0.05
    death: -50
  environment:
    player_flap_acc: -10

search_space:
  training_episodes: [1, 2]
  learning_rate: [0.4, 0.6]
  epsilon_start: [0.001, 0.01, 0.05]
  epsilon_end: [0.0, 0.001]
  epsilon_decay: [0.995, 1.0]
  discount_factor: [0.95, 0.99]
  sample_t: [2, 3]
  rewards.alive: [0.05, 0.1]

constraints:
  forbid_source_edits: true
  forbid_state_space_expansion: true
  eval_epsilon_must_be_zero: true

failure_demo:
  enabled: false

version_control:
  enabled: false
  auto_commit: false
  push: false
  remote: origin
  branch: null
  commit_message: null
