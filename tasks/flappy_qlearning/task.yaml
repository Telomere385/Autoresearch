task:
  name: flappy_bird_q_learning
  kind: reinforcement_learning
  algorithm: q_learning
  description: >
    Train and evaluate a tabular Q-learning policy for Flappy Bird.
    The task exposes a YAML-configured train/eval interface and writes JSON metrics.

interface:
  experiment_runner: tasks/flappy_qlearning/run.py
  single_run_runner: tasks/flappy_qlearning/run.py
  environment_source: tasks/flappy_qlearning/src/flappyq.py
  default_experiment_config: tasks/flappy_qlearning/config.yaml
  initial_data:
    q_table: tasks/flappy_qlearning/data/q_tables/Qvals.npy
  command_template: >
    python tasks/flappy_qlearning/run.py --config {config_path} --run-id {run_id}
  output:
    summary_json: runs/{run_id}/summary.json
    train_result_json: runs/{run_id}/train/result.json
    eval_result_json: runs/{run_id}/eval/result.json
    train_log: runs/{run_id}/train/run.log
    eval_log: runs/{run_id}/eval/run.log
    q_table: runs/{run_id}/train/q_table.npy

metrics:
  primary: mean_score
  direction: maximize
  diagnostics:
    - mean_reward
    - max_score
    - std_score
    - total_training_time
  success_target:
    mean_score: 5.0

editable_surface:
  mode: yaml_only
  config_section: base_experiment
  allowed_parameters:
    training_episodes: [1000, 1500, 2000]
    learning_rate: [0.3, 0.4, 0.6, 0.7]
    epsilon_start: [0.0, 0.001, 0.01, 0.05]
    epsilon_end: [0.0, 0.001]
    epsilon_decay: [0.99, 0.995, 1.0]
    discount_factor: [0.9, 0.95, 0.99]
    sample_t: [2, 3, 4]
    rewards.alive: [0.02, 0.05, 0.1]
  forbidden:
    - source_edits
    - state_discretization.dx_dy_bin_size
    - state_discretization.velocity_bin_size

budget:
  max_iterations: 3
  max_wall_time_minutes: 30
  seed: 0
  training_episodes: 1000
  evaluation_episodes: 100

reporting:
  raw_artifacts:
    - state.json
    - decisions.jsonl
    - planner_calls.jsonl
    - tool_calls.jsonl
    - errors.jsonl
    - report.md
  final_report_author: codex
